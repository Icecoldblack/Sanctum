<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // After a quick exit, leave again before anything else loads: on a decoy history entry, or on
      // any page reached with Back or Forward. Waiting for the app bundle would leave this address
      // on screen for too long. Must match EXIT_PATH and EXITED_KEY in quickExit.ts; main.tsx
      // repeats the check in case this one fails.
      try {
        var exitTo = localStorage.getItem('sanctum_exited')
        var nav = performance.getEntriesByType('navigation')[0]
        var returned = exitTo !== null && !!nav && nav.type === 'back_forward'
        if (location.pathname === '/start' || returned) {
          location.replace(/^https?:\/\//.test(exitTo) ? exitTo : 'https://www.wikipedia.org/')
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4c6557" />
    <meta
      name="description"
      content="Sanctum is a private mental health and safety space for women who feel unsafe but can't simply leave. No accounts, no digital trails, just support when you need it most."
    />
    <title>Sanctum</title>
    <script>
      // Apply a saved disguise (tab title and icon) before first paint, so the real name never
      // flashes in the tab while the app loads. The app re-applies it fully once it boots.
      try {
        var shell = JSON.parse(localStorage.getItem('app-shell') || 'null')
        if (shell && typeof shell.title === 'string') document.title = shell.title
        if (shell && typeof shell.icon === 'string' && shell.icon.indexOf('data:image/png;base64,') === 0) {
          var link = document.querySelector('link[rel="icon"]')
          link.type = 'image/png'
          link.href = shell.icon
        }
        if (shell && /^#[0-9a-fA-F]{6}$/.test(shell.theme)) {
          document.querySelector('meta[name="theme-color"]').content = shell.theme
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
